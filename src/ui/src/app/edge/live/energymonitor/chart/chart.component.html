<div #energymonitorChart style="text-align:center">
  <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="ball-clip-rotate-multiple"
    [fullScreen]="false" name="live-energymonitor"></ngx-spinner>
  <svg style.width="{{ width }}px" style.height="{{ height }}px" overflow="visible">
    <!-- !graphic -->
    <svg:g [attr.transform]="translation">
      <svg:g consumptionsection></svg:g>
      <svg:g gridsection></svg:g>
      <svg:g productionsection></svg:g>
      <svg:g storagesection></svg:g>

      <!-- Center hub: today's self-sufficiency -->
      <svg:circle cx="0" cy="0" [attr.r]="hubRadius" fill="var(--oe-panel-raised)" stroke="var(--oe-line)"
        stroke-width="1"></svg:circle>
      @if (selfSufficientTodayPct !== null) {
        <svg:g class="oe-hub">
          <svg:text x="0" [attr.y]="hubValueFontSize * 0.32" text-anchor="middle"
            font-family="var(--ion-font-family-mono)" font-variant-numeric="tabular-nums"
            [attr.font-size]="hubValueFontSize" font-weight="700"
            fill="var(--oe-ink)">{{ selfSufficientTodayPct | number:'1.0-0' }}%</svg:text>
          <svg:text x="0" [attr.y]="hubValueFontSize * 0.32 + hubLabelFontSize * 1.6" text-anchor="middle"
            font-family="var(--ion-font-family)" [attr.font-size]="hubLabelFontSize" fill="var(--oe-mist)"
            style="text-transform: uppercase; letter-spacing: 0.07em">{{ 'LIVE.MERIDIAN.SELF_SUFFICIENT_TODAY' | translate }}</svg:text>
        </svg:g>
      }
    </svg:g>
  </svg>
</div>
