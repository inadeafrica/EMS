<svg:path [attr.d]="trackPath" fill="none" stroke="var(--oe-line)" [attr.stroke-width]="trackStrokeWidth" stroke-linecap="round"></svg:path>
@if (isEnabled) {
  <svg:path [attr.d]="valuePath" fill="none" stroke="var(--oe-consumption)" [attr.stroke-width]="valueStrokeWidth"
    stroke-linecap="round" style="filter: drop-shadow(var(--oe-glow-consumption))"></svg:path>
}
@if (isEnabled && connector && connectorActive) {
  <svg:line [attr.x1]="connector.x1" [attr.y1]="connector.y1" [attr.x2]="connector.x2" [attr.y2]="connector.y2"
    stroke="var(--oe-consumption)" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"
    class="oe-connector" [class.oe-connector-reverse]="connectorReverse"></svg:line>
}
@if (isEnabled && clusterPosition && cluster) {
  <svg:g [attr.transform]="'translate(' + clusterPosition.x + ',' + clusterPosition.y + ')'">
    <svg:circle cx="0" [attr.cy]="cluster.badgeCenterY" [attr.r]="cluster.badgeRadius" fill="var(--oe-panel-raised)"
      stroke="var(--oe-line)" stroke-width="1"></svg:circle>
    <svg:svg [attr.x]="-cluster.iconSize / 2" [attr.y]="cluster.badgeCenterY - cluster.iconSize / 2"
      [attr.width]="cluster.iconSize" [attr.height]="cluster.iconSize" viewBox="0 0 24 24" fill="none"
      stroke="var(--oe-consumption)" stroke-width="2.2">
      <svg:path d="M4 20V10l8-6 8 6v10" stroke-linejoin="round"></svg:path>
      <svg:path d="M9 20v-6h6v6" stroke-linejoin="round"></svg:path>
    </svg:svg>
    <svg:text x="0" [attr.y]="cluster.labelY" text-anchor="middle" [attr.font-size]="cluster.labelFontSize"
      font-family="var(--ion-font-family)" fill="var(--oe-mist)"
      style="text-transform: uppercase; letter-spacing: 0.06em">{{ name }}</svg:text>
    <svg:text x="0" [attr.y]="cluster.valueY" text-anchor="middle" [attr.font-size]="cluster.valueFontSize"
      font-family="var(--ion-font-family-mono)" font-weight="600" fill="var(--oe-ink)">{{ valueText || '–' }}</svg:text>
  </svg:g>
}
