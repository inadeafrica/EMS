services:
  # OpenEMS Edge - Edge device controller
  openems-edge:
    build:
      context: ./src
      dockerfile: tools/docker/edge/Dockerfile
    image: openems/edge:local
    container_name: openems-edge
    hostname: openems-edge
    environment:
      - TZ=UTC
    volumes:
      - ./config/edge:/var/opt/openems/config:rw
      - edge-data:/var/opt/openems/data:rw
    ports:
      - "8090:8080"  # Apache Felix web console
      - "8085:8085"  # UI Websocket
    restart: unless-stopped
    networks:
      - openems-network

  # OpenEMS Backend - Central management server
  openems-backend:
    build:
      context: ./src
      dockerfile: tools/docker/backend/Dockerfile
    image: openems/backend:local
    container_name: openems-backend
    hostname: openems-backend
    environment:
      - TZ=UTC
    volumes:
      - ./config/backend:/var/opt/openems/config:rw
      - backend-data:/var/opt/openems/data:rw
    ports:
      - "8079:8079"  # Apache Felix web console
      - "8081:8081"  # Edge Websocket
      - "8082:8082"  # UI Websocket
    restart: unless-stopped
    networks:
      - openems-network

  # OpenEMS UI - Web interface (talks to the Backend)
  openems-ui:
    build:
      context: ./src
      dockerfile: tools/docker/ui/Dockerfile.backend
    image: openems/ui-backend:local
    container_name: openems-ui
    hostname: openems-ui
    environment:
      - WEBSOCKET_HOST=openems-backend
      - WEBSOCKET_PORT=8082
      - REST_PORT=8084
      - ENABLE_HTTPS=false
    volumes:
      - ui-conf:/etc/nginx:rw
      - ui-log:/var/log/nginx:rw
    ports:
      - "8080:80"  # Web UI
    depends_on:
      - openems-backend
    restart: unless-stopped
    networks:
      - openems-network

  # PostgreSQL - only needed if Backend Metadata is switched to an Odoo/DB-backed
  # provider. The default seeded config (Metadata/File.config) does not use it,
  # and no bundle in this repo reads OPENEMS_DB_*, so it is not wired to the
  # Backend service. Kept here for optional future use.
  postgres:
    image: postgres:15-alpine
    container_name: openems-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openems}
      - POSTGRES_USER=${POSTGRES_USER:-openems}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openems}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - openems-network

  # InfluxDB - only needed if Backend Timedata is switched to the Influx
  # provider. The default seeded config (Timedata/Dummy.config) does not use
  # it. Kept here for optional future use.
  influxdb:
    image: influxdb:2.7-alpine
    container_name: openems-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-adminpassword}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-openems}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-energy_data}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-openems-token-change-in-production}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - openems-network

networks:
  openems-network:
    driver: bridge

volumes:
  edge-data:
  backend-data:
  ui-conf:
  ui-log:
  postgres-data:
  influxdb-data:
